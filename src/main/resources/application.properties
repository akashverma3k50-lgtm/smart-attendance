spring.application.name=smart-attendance

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/smart_attendance
spring.datasource.username=root
spring.datasource.password=Akash3950@

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JSP View Resolver Configuration (Phase 4)
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Session & Cookie Security (Defense in Depth)
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
