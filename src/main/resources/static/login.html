<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Attendance System</title>
    <link rel="stylesheet" href="style.css">
    <script src="theme.js"></script>
</head>
<body data-theme="dark">
    <!-- Ambient Lighting Effects -->
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>

    <header>
        <a href="index.html" class="brand">
            <div class="brand-icon">📋</div>
            <span class="brand-text">Smart Attendance</span>
        </a>
        <nav class="nav-links">
            <button type="button" class="theme-toggle-btn" aria-label="Toggle Theme">
                <span class="theme-icon">☀️</span> <span class="theme-label">Light</span>
            </button>
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <div class="main-wrapper">
        <div class="form-card">
            <div style="text-align: center; margin-bottom: 22px;">
                <div style="display: inline-flex; align-items: center; justify-content: center; width: 54px; height: 54px; border-radius: 16px; background: var(--primary-light); color: var(--primary); font-size: 1.6rem; border: 1px solid var(--primary-glow); margin-bottom: 12px; animation: pulse-glow 3s infinite;">
                    🔒
                </div>
                <h2>Welcome Back</h2>
                <p class="subtitle" style="margin-bottom: 0;">Sign in to manage student attendance and view records.</p>
            </div>

            <!-- Dynamic Alert Box for JavaScript & Server Validation Messages -->
            <div id="loginAlertBox" class="alert-box"></div>

            <!-- Form: Submits via JavaScript (JSON representation) or direct Servlet POST -->
            <form id="loginForm" action="/loginServlet" method="POST">
                <div class="form-group">
                    <label for="loginUsername">Username</label>
                    <input type="text" id="loginUsername" name="username" placeholder="Enter username (e.g. admin)" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" name="password" placeholder="Enter your password" required autocomplete="current-password">
                </div>

                <button type="submit" id="loginBtn" class="btn">
                    <span>Sign In &rarr;</span>
                </button>
            </form>

            <div class="form-footer">
                Don't have an account? <a href="register.html">Register here</a>
            </div>
        </div>
    </div>

    <!-- Client-Side JavaScript Validation & JSON Handling (Phase 3) -->
    <script src="script.js"></script>
</body>
</html>
